[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[features]
pratt = []
# Phase 1 perf: gate the multi-pass CFG codegen so the runtime binary
# doesn't pull ~6,800 LOC of compiler code into its icache. See
# AGENTS.md Phase 30A for the full rationale.
cfg-codegen = []

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
ariadne = { version = "0.6.0", features = ["auto-color"] }
common = { path = "../common" }
parser = { path = "../parser" }
regex = "1.11.2"
rkyv = "0.8.12"

[dev-dependencies]
machine = { path = "../machine" }
