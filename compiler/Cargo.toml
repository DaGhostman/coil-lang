[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[features]
default = ["crypto", "time"]
crypto = ["machine/crypto"]
time = ["machine/time"]
pratt = []

[dependencies]
common = { path = "../common" }
machine = { path = "../machine" }
parser = { path = "../parser" }
reporting = { path = "../reporting" }
rkyv = "0.8.12"

[dev-dependencies]
machine = { path = "../machine", features = ["vm_profile"] }
proptest = "1"
libc = "0.2"
