[workspace]
members = [
    "common", "compiler", "machine", 
    "parser",
    "scanner",
]

[features]
trace = ["machine/trace"]
stress_gc = ["machine/stress"]
dump = ["compiler/dump"]
debug = ["trace", "stress_gc", "dump"]

[package]
name = "zero"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "common" }
scanner = { path = "scanner" }
parser = { path = "parser" }
compiler = { path = "compiler" }
machine = { path = "machine" }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = 1
