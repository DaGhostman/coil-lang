[workspace]
resolver = "3"
members = [ "common", "compiler", "machine", "parser"]

[package]
name = "zero-script"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "common" }
machine = { path = "machine" }
parser = { path = "parser" }
compiler = { path = "compiler" }
ariadne = { version = "0.6.0", features = ["auto-color"] }
rkyv = "0.8.12"

[dev-dependencies]
criterion = { version = "^0.8", features = ["html_reports"] }

[[bench]]
name = "fib"
harness = false

[[bench]]
name = "perf_gate"
harness = false

[features]
# Phase 1 perf: the multi-pass CFG-based codegen (`cfg_builder` +
# `linearize`) is gated behind this feature so the runtime binary can
# be compiled without pulling ~6,800 LOC of compiler code into the
# icache and triggering the BTB-prediction regression (see AGENTS.md
# Phase 1 perf). Enabling it is required to run the `cfg-codegen`
# pipeline tests and the `examples/cfg_smoke.0s` /
# `examples/control_flow_smoke.0s` showcases.
default = []
# Note: the actual `cfg-codegen` feature flag lives in
# `compiler/Cargo.toml` (so it's a package-scoped feature, which
# `#[cfg]` can reference). The workspace-level entry above is
# reserved for future workspace-wide feature flags.

[profile.release]
opt-level=3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# debug = 1

[profile.branch_misses]
inherits="release"
debug = 2
