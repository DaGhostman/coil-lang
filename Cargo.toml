[workspace]
resolver = "3"
members = [ "common", "machine", "parser"]

[package]
name = "zero-script"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "common" }
machine = { path = "machine" }
parser = { path = "parser" }
compiler = { path = "compiler" }

[dev-dependencies]
criterion = { version = "^0.7", features = ["html_reports"] }

[[bench]]
name = "fib"
harness = false

[profile.release]
opt-level=3
lto = "fat"
codegen-units = 1

debug = 1
