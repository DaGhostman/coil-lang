[package]
name = "coil-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
machine = { path = "../machine", default-features = false }
rkyv = "0.8.12"

[features]
default = ["crypto", "time", "regex", "tls"]
crypto = ["machine/crypto"]
time = ["machine/time"]
regex = ["machine/regex"]
tls = ["machine/tls"]
