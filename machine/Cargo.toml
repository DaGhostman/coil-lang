[package]
name = "machine"
version = "0.1.0"
edition = "2024"

[features]
default = ["crypto", "time", "regex", "tls"]
debugger = []
crypto = [
    "dep:sha2",
    "dep:blake3",
    "dep:hmac",
    "dep:chacha20poly1305",
    "dep:aes-gcm",
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:argon2",
    "dep:getrandom",
    "dep:zeroize",
    "dep:subtle",
]
time = ["dep:chrono"]
regex = ["dep:pcre2"]
tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]
vm_profile = []

[dependencies]
common = { path = "../common" }
coil-simd = { path = "../coil-simd" }
rkyv = "0.8.12"
libloading = "0.9"
libffi = "5.1.1"
libc = "0.2"
sha2 = { version = "0.11.0", optional = true }
blake3 = { version = "1.8.5", optional = true }
hmac = { version = "0.13.0", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
aes-gcm = { version = "0.11.0", optional = true }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"], optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }
argon2 = { version = "0.5.3", optional = true }
getrandom = { version = "0.4.3", optional = true }
zeroize = { version = "1.9.0", optional = true }
subtle = { version = "2.6.1", optional = true }
chrono = { version = "0.4.45", optional = true }
pcre2 = { version = "0.2", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
libc = "0.2"
rcgen = "0.13"
