[package]
name = "machine"
version = "0.1.0"
edition = "2024"

[features]
default = []
vm_profile = []

[dependencies]
common = { path = "../common" }
rkyv = "0.8.12"
libloading = "0.9"
libffi = "5.1.1"
libc = "0.2"
sha2 = "0.11.0"
blake3 = "1.8.5"
hmac = "0.13.0"
chacha20poly1305 = "0.11.0"
aes-gcm = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
argon2 = "0.5.3"
getrandom = "0.4.3"
zeroize = "1.9.0"
subtle = "2.6.1"
chrono = "0.4.45"

[dev-dependencies]
libc = "0.2"
