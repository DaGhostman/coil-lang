name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    name: cargo test + CLI harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace tests
        run: cargo test --workspace

      - name: Language harness (`zero-script test`)
        run: |
          cargo build -q
          ./target/debug/zero-script test
