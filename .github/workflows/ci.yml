name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

# Prefer `--lib --tests --bins` over `--all-targets`: Criterion benches under
# `[[bench]]` treat argv after `--` as their own CLI and abort the suite.

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - id: default
            flags: ""
            mode: test
        include:
          - os: ubuntu-latest
            features:
              id: no-default
              flags: "--no-default-features"
              mode: check
          - os: ubuntu-latest
            features:
              id: crypto
              flags: "--no-default-features --features crypto"
              mode: check
          - os: ubuntu-latest
            features:
              id: time
              flags: "--no-default-features --features time"
              mode: check
          - os: ubuntu-latest
            features:
              id: regex
              flags: "--no-default-features --features regex"
              mode: check
          - os: ubuntu-latest
            features:
              id: tls
              flags: "--no-default-features --features tls"
              mode: check
          - os: ubuntu-latest
            features:
              id: dissect
              flags: "--features dissect"
              mode: test
          - os: ubuntu-latest
            features:
              id: debugger
              flags: "--features debugger"
              mode: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi pcre2
          pkg-config --exists libpcre2-8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.id }}

      - name: Build all CLI binaries
        if: matrix.features.id == 'default'
        run: cargo build

      - name: Workspace check (${{ matrix.features.id }})
        if: matrix.features.mode == 'check'
        run: |
          cargo check --workspace --lib --tests --bins ${{ matrix.features.flags }}

      - name: Workspace tests (${{ matrix.features.id }})
        if: matrix.features.mode == 'test'
        run: |
          # macOS: cargo lists many test binaries in parallel and hits EAGAIN.
          # Raise nofile and serialize package test runs so listing is sequential.
          jobs=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            ulimit -n 10240 || true
            jobs="--jobs 1"
          fi
          n=0
          until cargo test --workspace --lib --tests --bins $jobs ${{ matrix.features.flags }}; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              exit 1
            fi
            sleep 3
          done

      - name: Language harness (`coil test`)
        if: matrix.features.id == 'default'
        run: |
          ./target/debug/coil test

      - name: Showcase project tests
        if: matrix.features.id == 'default'
        run: |
          BIN=./target/debug/coil ./examples/projects/run-tests.sh
