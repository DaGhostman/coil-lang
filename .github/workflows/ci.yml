name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    name: cargo test + CLI harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi pcre2
          pkg-config --exists libpcre2-8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build all CLI binaries
        run: cargo build

      - name: Workspace tests
        run: |
          # macOS runners occasionally hit EAGAIN (WouldBlock) while cargo
          # lists many test binaries in parallel; one retry clears it.
          # default-members builds coil + coil-debug/dissect/fmt/embed together.
          cargo test || cargo test
          cargo test -p compiler --features dissect || cargo test -p compiler --features dissect

      - name: Language harness (`coil test`)
        run: |
          ./target/debug/coil test

      - name: Showcase project tests
        run: |
          BIN=./target/debug/coil ./examples/projects/run-tests.sh
